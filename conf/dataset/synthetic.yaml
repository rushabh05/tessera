# @package _global_
dataset:
  name: synthetic
  builder: tessera.data.synthetic.make_synthetic
  # SYNTHETIC. Validates the harness against known ground truth and lets the demo
  # track build in week 1. Never a reported detection result.
  is_synthetic: true
  params:
    n_replicas: 8
    hosts_per_replica: 6
    windows_per_host: 1440
    prevalence: 0.06
    missingness_label_coupling: 0.35
    unlabellable_host_fraction: 0.2
    redundant_copy_of: null
