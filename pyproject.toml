[project]
name = "tessera"
version = "0.1.0"
description = "Multimodal cloud anomaly detection with evidence-independence regularisation, a verdict transparency log, and a leakage-instrumented evaluation harness"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
  # numerics / data
  "numpy>=1.26",
  "polars>=1.0",
  "pyarrow>=16",
  "scipy>=1.12",
  # deep learning
  "torch>=2.4",
  # classical baselines
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  # log parsing
  "drain3>=0.9.11",
  # config / experiment management
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  # optimisers for the chain simulator
  "optuna>=3.6",
  "pymoo>=0.6",
  # graph modality
  "networkx>=3.2",
  # ledger crypto (Ed25519)
  "cryptography>=42",
  # reporting
  "matplotlib>=3.8",
  "rich>=13.7",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pulled separately: heavy, and only needed once to initialise the M1 template
# embedding table. Everything else runs without it.
embed = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: excluded from CI, run locally",
  "mustfail: asserts a guard correctly rejects a bad input",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
